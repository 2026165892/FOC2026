    <div class="column">
        <h2>For Loop Multiplier</h2>

        <div class="calc-container">
            <p>
                <label for="num1">Generate multiplication table for:</label><br>
                <input type="number" id="num1" value="5">
            </p>
            <button onclick="generateTable()">Run For Loop</button>
            
            <div id="result" style="margin-top: 20px; color: #333; line-height: 1.6;">
            
            </div>
        </div>

    </div>
</div>

<script>
    function generateTable() {
        let n1 = document.getElementById("num1").value;
        let number = Number(n1);
        
        
        let outputText = "<h3>Results:</h3>";

        
        for (let i = 1; i <= 10; i++) {
            let rowResult = number * i;
            outputText += number + " x " + i + " = " + rowResult + "<br>";
        }

        
        document.getElementById("result").innerHTML = outputText;
    }
</script>
