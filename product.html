        <h2>Basic Product Calculation</h2>

        <div class="calc-container">
            <p>
                <label for="num1">Enter Number 1:</label><br>
                <input type="number" id="num1">
            </p>
            <p>
                <label for="num2">Enter Number 2:</label><br>
                <input type="number" id="num2">
            </p>
            <button onclick="calculateProduct()">Calculate Product</button>
            
            <h3 id="result" style="margin-top: 20px; color: #333;">The product is: </h3>
        </div>

    </div>
</div>

<script>
    function calculateProduct() {
        let n1 = document.getElementById("num1").value;
        let n2 = document.getElementById("num2").value;

        let number1 = Number(n1);
        let number2 = Number(n2);

        let product = number1 * number2;

        document.getElementById("result").innerText = "The product is: " + product;
    }
</script>
