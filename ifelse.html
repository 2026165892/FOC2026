    <div class="column">
        <h2>Enter Number To Determine If It's Even Or Odd.</h2>

        <div class="calc-container">
            <p>
                <label for="num1">Enter a Number:</label><br>
                <input type="number" id="num1">
            </p>
            <button onclick="checkNumber()">Check Number</button>
            
            <h3 id="result" style="margin-top: 20px; color: #333;">The number is: </h3>
        </div>

    </div>
</div>

<script>
    function checkNumber() {
        let n1 = document.getElementById("num1").value;
        let number1 = Number(n1);

        // If the number divided by 2 has a remainder of 0, it is even.
        // Otherwise, it jumps to the 'else' block.
        if (number1 % 2 === 0) {
            document.getElementById("result").innerText = "The number is: EVEN";
        } else {
            document.getElementById("result").innerText = "The number is: ODD";
        }
    }
</script>
